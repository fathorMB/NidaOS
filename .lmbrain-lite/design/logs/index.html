<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NidaOS logs</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4efe9; --panel: #fffdfa; --sunk: #ebe4dc; --line: #d8cec3;
  --text: #221b16; --muted: #6f6359; --accent: #c2501a; --on-accent: #fff8f2;
  --sys: #5d544c; --perf: #c2501a; --std: #2f6c98;
  --ok: #2e7d4f; --warn: #a66a00; --bad: #b3261e;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --display: "Bahnschrift", "DIN Alternate", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12100e; --panel: #1b1816; --sunk: #151210; --line: #342d28;
    --text: #efe7df; --muted: #a2968b; --accent: #f08a3e; --on-accent: #1a0f07;
    --sys: #b9aea3; --perf: #f08a3e; --std: #7fb0d6;
    --ok: #74c493; --warn: #e2b04a; --bad: #ef7d73;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); display: flex; flex-direction: column; height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.top { display: flex; align-items: center; gap: 18px; padding: 0 16px; height: 44px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
.brand { display: flex; align-items: center; gap: 8px; font: 600 16px/1 var(--display); letter-spacing: .04em; }
.brand svg { width: 20px; height: 20px; }
.host { font: 13px/1 var(--mono); color: var(--muted); }
.top .right { margin-left: auto; font: 11px/1 var(--mono); color: var(--muted); }

.dock { flex: none; display: flex; justify-content: center; gap: 4px; padding: 8px; background: var(--panel); border-top: 1px solid var(--line); }
.dock a { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 78px; padding: 7px 0 5px; border-radius: 6px; font-size: 11px; color: var(--muted); border: 1px solid transparent; }
.dock a:hover { background: var(--sunk); color: var(--text); }
.dock a[aria-current] { color: var(--text); border-color: var(--line); background: var(--sunk); }
.dock svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.dock .sep { width: 1px; background: var(--line); margin: 6px 8px; }

.desk { flex: 1; min-height: 0; padding: 14px; display: flex; }
.win { flex: 1; min-width: 0; display: grid; grid-template-columns: 230px minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
input[type=search] { font: 13px/1.3 var(--mono); color: inherit; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; flex: 1; min-width: 160px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; font-size: 13px; white-space: nowrap; }
.chip[aria-pressed=false] { color: var(--muted); opacity: .6; text-decoration: line-through; }
.chip i, .lv i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; }
.chip b { font: 12px/1 var(--mono); font-weight: 400; color: var(--muted); }
.btn { border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn[aria-pressed=true] { background: var(--text); color: var(--bg); border-color: var(--text); }
select { font: inherit; color: inherit; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }

.side { grid-row: 2 / 4; border-right: 1px solid var(--line); background: var(--sunk); padding: 12px 8px; overflow: auto; }
.side h2 { font: 600 11px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 8px 6px; }
.side h2:first-child { margin-top: 2px; }
.src { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; padding: 6px 8px; border-radius: 6px; }
.src:hover { background: var(--line); }
.src[aria-current=true] { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.src span { margin-left: auto; font: 11px/1 var(--mono); color: var(--muted); font-weight: 400; }
.src em { font-style: normal; color: var(--bad); font: 11px/1 var(--mono); }

.hist { padding: 10px 14px 6px; border-bottom: 1px solid var(--line); }
.hist .cap { display: flex; justify-content: space-between; font: 11px/1 var(--mono); color: var(--muted); margin-top: 4px; }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 44px; }
.bars div { flex: 1; display: flex; flex-direction: column-reverse; gap: 1px; min-width: 2px; }
.bars i { display: block; background: var(--muted); opacity: .45; border-radius: 1px; }
.bars i.w { background: var(--warn); opacity: 1; } .bars i.e { background: var(--bad); opacity: 1; }

.stream { overflow: auto; font: 12.5px/1.55 var(--mono); }
.ln { display: grid; grid-template-columns: 78px 78px 110px minmax(0, 1fr); gap: 0 12px; padding: 4px 14px; border-bottom: 1px solid var(--line); cursor: default; }
.ln:hover { background: var(--sunk); }
.ln time { color: var(--muted); }
.lv { display: inline-flex; align-items: center; gap: 6px; }
.ln .s { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ln .m { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ln.error { box-shadow: inset 3px 0 0 var(--bad); } .ln.warning { box-shadow: inset 3px 0 0 var(--warn); }
.ln[aria-expanded=true] { background: var(--sunk); }
.ln[aria-expanded=true] .m { white-space: normal; overflow-wrap: anywhere; }
.ln .more { grid-column: 4; color: var(--muted); padding: 4px 0 6px; display: none; white-space: pre-wrap; overflow-wrap: anywhere; }
.ln[aria-expanded=true] .more { display: block; }
.ln mark { background: var(--accent); color: var(--on-accent); border-radius: 2px; padding: 0 1px; }
.empty { padding: 40px 14px; color: var(--muted); text-align: center; font-family: var(--font); }
.status { grid-column: 1 / -1; border-top: 1px solid var(--line); padding: 6px 14px; font: 12px/1.4 var(--mono); color: var(--muted); display: flex; gap: 18px; }
.status span:last-child { margin-left: auto; }
.live { color: var(--ok); }

@media (max-width: 820px) {
  .win { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr) auto; }
  .side { grid-row: auto; border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px; padding: 6px; }
  .side h2, .src span { display: none; } .src { width: auto; white-space: nowrap; }
  .ln { grid-template-columns: 62px 16px minmax(0, 1fr); } .ln .s { display: none; } .lv span { display: none; } .ln .more { grid-column: 3; }
  .host { display: none; } .dock a { width: 58px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 26 26" aria-hidden="true"><path d="M2 2h22v14l-8 8H2z" fill="var(--accent)"/><path d="M8 18V8l10 10V8" fill="none" stroke="var(--on-accent)" stroke-width="2.4"/></svg>
    NidaOS
  </div>
  <span class="host">nidaos.local · Logs</span>
  <div class="right">mockup · sample data</div>
</header>

<div class="desk">
  <div class="win">
    <div class="bar">
      <input type="search" id="q" placeholder="Find text in the messages" aria-label="Find text in the messages">
      <button class="chip" data-level="error" aria-pressed="true" style="--c:var(--bad)"><i></i>Errors <b></b></button>
      <button class="chip" data-level="warning" aria-pressed="true" style="--c:var(--warn)"><i></i>Warnings <b></b></button>
      <button class="chip" data-level="info" aria-pressed="true" style="--c:var(--muted)"><i></i>Information <b></b></button>
      <select aria-label="Time range"><option>Last hour</option><option>Today</option><option>Last 7 days</option><option>Since the last restart</option></select>
      <button class="btn" id="follow" aria-pressed="true">Follow</button>
      <button class="btn">Save to a file</button>
    </div>

    <nav class="side" id="side" aria-label="Sources"></nav>

    <div class="hist">
      <div class="bars" id="bars"></div>
      <div class="cap"><span>60 minutes ago</span><span id="range">lines for each minute</span><span>now</span></div>
    </div>

    <div class="stream" id="stream" aria-live="off"></div>

    <div class="status"><span id="count"></span><span id="state" class="live"></span><span>The system keeps the logs for 30 days</span></div>
  </div>
</div>

<nav class="dock" aria-label="Programs">
  <a href="../desktop/index.html"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>Monitor</a>
  <a href="../desktop/index.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/></svg>Terminal</a>
  <a href="../files/index.html"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Files</a>
  <a href="index.html" aria-current="page"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 8h6M9 12h6M9 16h3"/></svg>Logs</a>
  <span class="sep"></span>
  <a href="../console/index.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>Console</a>
  <a href="../desktop/index.html#power"><svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 7.3a8 8 0 1 0 11.4 0"/></svg>Power</a>
</nav>

<script>
// Sample data. Each line: minutes before now, level, source, message, detail.
const groups = [
  ['All sources', [['all', 'Everything']]],
  ['System', [['system', 'System'], ['update', 'Updates'], ['storage', 'Storage'], ['gateway', 'Gateway'], ['agent', 'Agents']]],
  ['Apps', [['shop-web', 'shop-web'], ['shop-api', 'shop-api'], ['photos', 'photos'], ['notes', 'notes']]],
  ['Databases', [['orders-db', 'orders-db'], ['photos-db', 'photos-db']]],
];
let lines = [
  [1, 'info', 'shop-api', 'GET /orders?page=2 200 in 41 ms', 'request id 9f2c1e · user 1184 · through the gateway'],
  [2, 'info', 'gateway', 'Sign-in accepted for photos.example.net', 'session 5 of 5 · address 93.41.x.x'],
  [3, 'warning', 'shop-api', 'The connection pool to orders-db is 90% full (18 of 20)', 'pool "main" · the limit is in the settings of shop-api'],
  [4, 'error', 'shop-api', 'POST /checkout 500: timeout after 5000 ms waiting for orders-db', 'request id 77ab03\n  at OrderService.create (order.js:118)\n  at CheckoutController.post (checkout.js:52)'],
  [4, 'warning', 'orders-db', 'A query ran for 5.2 s: UPDATE orders SET state = …', 'table orders · 48 213 rows examined · no index on "state"'],
  [6, 'info', 'shop-web', 'Deploy 7c1d9a2 from github.com/example/shop-web: complete', 'runner nida-runner-1 · 1 min 12 s · image 84 MB'],
  [6, 'info', 'shop-web', 'The new version answers the health check', 'old version stopped after 20 s'],
  [8, 'info', 'agent', 'Claude Code read the status of 6 workloads', 'token "laptop" · tool nida_status'],
  [11, 'info', 'photos', 'Import complete: 214 photos, 1.8 GB', 'folder /standard/apps/photos/library/import-queue'],
  [14, 'warning', 'storage', 'The Performance tier is 54% full. At this rate it is full in 71 days', 'disk SanDisk SDSSDHP · the largest user is orders-db'],
  [19, 'info', 'system', 'Remote Desktop session started for nida', 'from 192.168.1.23'],
  [27, 'info', 'notes', 'GET /api/notes 200 in 12 ms', 'LAN only'],
  [31, 'error', 'photos', 'Cannot make the thumbnail of IMG_4471.heic: format not supported', 'the import continued with the next file'],
  [33, 'info', 'photos-db', 'Automatic clean-up of table "assets" complete', ''],
  [38, 'info', 'gateway', 'Link to the Raspberry gateway is good: 18 ms', 'checked each 30 s'],
  [44, 'info', 'agent', 'Claude Code changed the memory limit of orders-db from 2 GB to 3 GB', 'token "laptop" · tool nida_database_set · approved by the rules'],
  [49, 'info', 'update', 'Update 45.4 downloaded and verified. It waits for your approval', 'size 412 MB · version 45.2 stays available for a rollback'],
  [52, 'warning', 'system', 'The processor temperature was 78 °C for 40 s', 'limit for a warning: 75 °C'],
  [57, 'info', 'orders-db', 'Checkpoint complete: 312 buffers written', ''],
];
const levelName = { error: 'Error', warning: 'Warning', info: 'Info' };
const levelColour = { error: 'var(--bad)', warning: 'var(--warn)', info: 'var(--muted)' };
const on = { error: true, warning: true, info: true };
let source = 'all', follow = true, open = -1, id = 0;
lines = lines.map((l) => ({ id: id++, ago: l[0], level: l[1], src: l[2], msg: l[3], more: l[4] }));
const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const inSource = (l) => source === 'all' || l.src === source;
const stamp = (ago) => new Date(Date.now() - ago * 60000).toTimeString().slice(0, 8);

function draw() {
  const q = $('#q').value.trim().toLowerCase();
  const scope = lines.filter(inSource);
  document.querySelectorAll('.chip').forEach((c) => {
    c.setAttribute('aria-pressed', on[c.dataset.level]);
    c.querySelector('b').textContent = scope.filter((l) => l.level === c.dataset.level).length;
  });
  $('#side').innerHTML = groups.map(([head, list]) => `<h2>${head}</h2>` + list.map(([key, label]) => {
    const mine = lines.filter((l) => key === 'all' || l.src === key);
    const errs = mine.filter((l) => l.level === 'error').length;
    return `<button class="src" data-src="${key}" aria-current="${key === source}">${label}${errs ? `<em>${errs} err</em>` : ''}<span>${mine.length}</span></button>`;
  }).join('')).join('');

  // One column for each 2 minutes of the last hour.
  const cols = Array.from({ length: 30 }, () => ({ info: 0, warning: 0, error: 0 }));
  scope.forEach((l) => { const c = cols[29 - Math.min(29, Math.floor(l.ago / 2))]; c[l.level] += 1; });
  $('#bars').innerHTML = cols.map((c) => `<div>${'<i class="e" style="height:9px"></i>'.repeat(c.error)}${'<i class="w" style="height:9px"></i>'.repeat(c.warning)}${'<i style="height:9px"></i>'.repeat(c.info)}</div>`).join('');

  const shown = scope.filter((l) => on[l.level] && (!q || (l.msg + ' ' + l.more).toLowerCase().includes(q)));
  const hi = (s) => { if (!q) return esc(s); const i = s.toLowerCase().indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)); };
  $('#stream').innerHTML = shown.length ? shown.map((l) => `
    <div class="ln ${l.level}" data-id="${l.id}" aria-expanded="${l.id === open}" tabindex="0">
      <time>${stamp(l.ago)}</time><span class="lv" style="--c:${levelColour[l.level]}"><i></i><span>${levelName[l.level]}</span></span>
      <span class="s">${l.src}</span><span class="m">${hi(l.msg)}</span>
      <div class="more">${l.more ? hi(l.more) : 'No more data for this line.'}</div>
    </div>`).join('') : '<div class="empty">No line agrees with the filters.</div>';
  $('#count').textContent = `${shown.length} of ${scope.length} lines`;
  $('#state').textContent = follow ? '● Follow is on: new lines come in at the top' : '';
  $('#follow').setAttribute('aria-pressed', follow);
}

document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip'), src = e.target.closest('[data-src]'), ln = e.target.closest('.ln');
  if (chip) { on[chip.dataset.level] = !on[chip.dataset.level]; draw(); }
  else if (src) { source = src.dataset.src; open = -1; draw(); }
  else if (ln) { open = open === +ln.dataset.id ? -1 : +ln.dataset.id; follow = open === -1 && follow; draw(); }
});
$('#q').addEventListener('input', draw);
$('#follow').addEventListener('click', () => { follow = !follow; draw(); });

// With Follow on, a new line comes in at intervals.
const feed = [
  ['info', 'shop-api', 'GET /products 200 in 23 ms', 'through the gateway'],
  ['info', 'notes', 'PUT /api/notes/41 200 in 19 ms', 'LAN only'],
  ['info', 'gateway', 'Sign-in accepted for shop.example.net', ''],
  ['warning', 'shop-api', 'The connection pool to orders-db is 85% full (17 of 20)', 'pool "main"'],
  ['info', 'orders-db', 'Checkpoint complete: 96 buffers written', ''],
];
let n = 0;
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  setInterval(() => {
    if (!follow) return;
    lines.forEach((l) => { l.ago += 0.07; });
    const f = feed[n++ % feed.length];
    lines.unshift({ id: id++, ago: 0, level: f[0], src: f[1], msg: f[2], more: f[3] });
    draw();
  }, 4000);
}
draw();
</script>
</body>
</html>
