name: image

# Build the NidaOS image and the installer ISO. Then install the ISO in a
# QEMU virtual machine with three disks and examine the result.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to ghcr.io after the test
        type: boolean
        default: false
      upload_iso:
        description: Keep the installer ISO as an artifact for 3 days
        type: boolean
        default: false
  push:
    branches: [main, "m01-*", "m02-*", "m03-*", "m04-*", "m05-*"]
    paths:
      - core/**
      - image/**
      - installer/**
      - tests/**
      - scripts/**
      - .github/workflows/image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/fathormb/nidaos
  IMAGE_TAG: proof

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Make free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install the test tools
        run: |
          # The Azure mirror of Ubuntu is sometimes not available from the
          # runner (run 43051313619). The step uses the main archive.
          sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' \
            -e 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#' \
            /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          grep -rh '^URIs\|^deb ' /etc/apt/sources.list.d/ /etc/apt/sources.list 2>/dev/null | sort -u || true
          apt() { sudo timeout 900 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 "$@"; }
          apt update
          apt install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf xorriso socat freerdp3-x11

      - name: Build the image
        run: sudo podman build -t "$IMAGE:$IMAGE_TAG" --build-arg NIDAOS_BUILD=v1 --build-context core=core -f image/Containerfile image

      - name: Build the installer image
        run: |
          sudo podman build -t localhost/nidaos-installer:proof \
            --build-arg "PAYLOAD_REF=$IMAGE:$IMAGE_TAG" \
            -f installer/Containerfile installer

      - name: Build the installer ISO
        run: |
          mkdir -p out
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$PWD/out:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ghcr.io/osbuild/image-builder-cli:latest \
            build \
            --bootc-ref localhost/nidaos-installer:proof \
            --bootc-installer-payload-ref "$IMAGE:$IMAGE_TAG" \
            --bootc-default-fs xfs \
            bootc-generic-iso
          sudo find out -name '*.iso' -exec ls -lh {} \;
          df -h /

      - name: Build the second image version for the update test
        run: |
          # The virtual machine connects to this registry as 10.0.2.2:5000.
          sudo podman run -d --name registry -p 5000:5000 docker.io/library/registry:2
          sudo podman build -t localhost:5000/nidaos:v2 --build-arg NIDAOS_BUILD=v2 --build-context core=core -f image/Containerfile image
          sudo podman push --tls-verify=false localhost:5000/nidaos:v2

      - name: Install and test in a virtual machine
        env:
          UPDATE_REF: 10.0.2.2:5000/nidaos:v2
          # The GitHub App and the private repository of the M-05 test
          # (knowledge/testing.md). Without them, the test skips the flow.
          NIDA_TEST_GITHUB_APP_ID: ${{ secrets.NIDA_TEST_GITHUB_APP_ID }}
          NIDA_TEST_GITHUB_APP_KEY: ${{ secrets.NIDA_TEST_GITHUB_APP_KEY }}
          NIDA_TEST_GITHUB_REPO: ${{ vars.NIDA_TEST_GITHUB_REPO }}
        run: |
          ls -l /dev/kvm
          iso=$(sudo find out -name '*.iso' | head -n1)
          sudo --preserve-env=UPDATE_REF,GITHUB_RUN_ID,NIDA_TEST_GITHUB_APP_ID,NIDA_TEST_GITHUB_APP_KEY,NIDA_TEST_GITHUB_REPO bash scripts/vm-test.sh "$iso" out/vm

      - name: Collect the test results
        if: always()
        run: |
          mkdir -p out/results
          sudo sh -c 'cp out/vm/*.png out/vm/*.log out/vm/report.txt out/results/ 2>/dev/null || true'
          sudo chmod -R a+rX out/results
          [ -f out/results/report.txt ] && cat out/results/report.txt >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        # The account can have no free artifact storage. The report is also in the log.
        continue-on-error: true
        with:
          name: vm-test-results
          path: out/results
          retention-days: 7

      - name: Keep the installer ISO
        if: github.event_name == 'workflow_dispatch' && inputs.upload_iso
        uses: actions/upload-artifact@v4
        with:
          name: nidaos-installer-iso
          path: out/**/*.iso
          retention-days: 3
          compression-level: 0

      - name: Push the image
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push "$IMAGE:$IMAGE_TAG"
          sudo podman push "$IMAGE:$IMAGE_TAG" "$IMAGE:${{ github.sha }}"
