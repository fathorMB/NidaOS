name: core

# Examine and test the core service (core/). This cycle is short. It does not
# build the image.

on:
  workflow_dispatch:
  push:
    branches: [main, "m01-*", "m02-*", "m03-*", "m04-*", "m05-*"]
    paths:
      - core/**
      - .github/workflows/core.yml
  pull_request:
    paths:
      - core/**
      - .github/workflows/core.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          # The module has no dependencies yet, thus there is no go.sum.
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Test on the real files of the runner
        env:
          # Read the real journal of the runner in the log tests.
          NIDA_TEST_JOURNAL: "1"
          NIDA_TEST_JOURNALCTL: sudo journalctl
        run: go test -race -count=1 -v -run '^TestReal' ./...
      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/nida-core .
          CGO_ENABLED=0 go build -trimpath -o /tmp/nida ./cmd/nida
          /tmp/nida --help | head -3
