# The backups of the managed databases are on the standard tier (decision
# D24). Only root can read them: they have all the data of the databases.
d /var/nida/standard/backups 0700 root root -
# The file program of the desktop (milestone M-08) shows the app or the
# database of each volume folder. The owner can read the names of the
# folders, not their content: each volume folder keeps its own mode.
d /var/nida/performance/volumes 0755 root root -
d /var/nida/standard/volumes 0755 root root -
