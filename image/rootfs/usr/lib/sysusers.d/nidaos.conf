# The members of the group nida can open the local socket of nida-core
# (/run/nidaos/core.sock) and use the nida command without a password
# (decision D18).
g nida -
#
# The installer makes the owner user "nida" with its own group "nida".
# Then this line does not change the group, and the owner can open the
# socket. For an other owner name, the installer adds the user to the
# group (milestone M-07).
