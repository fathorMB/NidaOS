# The local image registry of NidaOS (decision D21, milestone M-03).
#
# A deploy takes the image of an app from this registry. The registry
# listens only on 127.0.0.1:5000 of the computer: the GitHub runner of M-05
# and the tests push to it on the computer. k3s pulls from it through the
# mirror in /etc/rancher/k3s/registries.yaml. The images stay on the
# standard tier.
apiVersion: v1
kind: Namespace
metadata:
  name: nida-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry
  namespace: nida-system
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nida-standard
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: nida-system
  labels:
    app.kubernetes.io/name: registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      # The host network gives the address 127.0.0.1:5000 of the computer.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-cluster-critical
      automountServiceAccountToken: false
      containers:
      - name: registry
        image: docker.io/library/registry:3.0.0
        imagePullPolicy: IfNotPresent
        env:
        - name: REGISTRY_HTTP_ADDR
          value: "127.0.0.1:5000"
        - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
          value: /var/lib/registry
        - name: REGISTRY_STORAGE_DELETE_ENABLED
          value: "true"
        - name: OTEL_TRACES_EXPORTER
          value: none
        volumeMounts:
        - name: images
          mountPath: /var/lib/registry
        readinessProbe:
          httpGet:
            host: 127.0.0.1
            path: /v2/
            port: 5000
          periodSeconds: 5
        resources:
          limits:
            memory: 256Mi
      volumes:
      - name: images
        persistentVolumeClaim:
          claimName: registry
