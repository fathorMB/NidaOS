# The boot menu of the NidaOS installation media (milestone M-07).
# image-builder (image type generic-iso) replaces ${kernelpath},
# ${initrdpath} and ${root}: the live system boots from LiveOS/squashfs.img.
label: "NidaOS-Installer"
grub2:
  timeout: 5
  entries:
    - name: "Install NidaOS"
      linux: "${kernelpath} ${root} rd.live.image rd.live.overlay.overlayfs=1 console=ttyS0 console=tty0 selinux=0 quiet"
      initrd: "${initrdpath}"
