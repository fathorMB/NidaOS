# One pod writes a warning line each 2 seconds. The VM test reads the
# lines with "nida logs" (milestone M-02).
apiVersion: v1
kind: Pod
metadata:
  name: nida-log-proof
spec:
  containers:
    - name: writer
      image: rancher/mirrored-library-busybox:1.37.0
      command:
        - sh
        - -c
        - 'i=0; while true; do echo "level=warn msg=nida-log-proof-$i"; i=$((i+1)); sleep 2; done'
